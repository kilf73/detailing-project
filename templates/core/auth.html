{% extends 'base.html' %}

{% block title %}Вход и регистрация — Детейлинг-Бокс{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-card-figma">
        <div class="auth-tabs">
            <button class="tab-btn active">Вход</button>
            <button class="tab-btn">Регистрация</button>
        </div>

        <div class="auth-form">
            <div class="form-group-figma">
                <label>Email или телефон*</label>
                <div class="input-val-box">+7 900 000 00 00</div>
            </div>

            <div class="form-group-figma">
                <label>Пароль*</label>
                <div class="input-val-box password-dots">••••••••</div>
            </div>

            <div class="error-banner-figma">
                Ошибка: Неверный логин или пароль.<br>Попробуйте ещё раз
            </div>

            <button class="btn-action-dark btn-block-figma">Войти в кабинет</button>
            
            <div class="auth-footer-link">
                <a href="#">Забыли пароль? Восстановить доступ</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
